<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glückwunsch!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      text-align: center;
    }

    .karte {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      max-width: 520px;
      margin: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.5;
    }

    .emoji {
      font-size: 4rem;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>
  <div class="karte">
    <div class="emoji">🎉</div>
    <h1>Herzlichen Glückwunsch!</h1>
    <p>
      Du hast deine erste eigene HTML-Website geöffnet.
      <br><br>
      Der erste Schritt zur eigenen Website ist geschafft! 🚀
    </p>
  </div>
</body>
</html>
